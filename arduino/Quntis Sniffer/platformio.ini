; Bare NRF24L01 Sniffer for capturing Quntis remote packets

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
	nrf24/RF24@^1.4.8

build_flags =
	-D CORE_DEBUG_LEVEL=3

monitor_speed = 115200
upload_speed = 921600

[env:lolin_c3_mini]
extends = env:esp32dev
platform = espressif32@6.8.1
board = lolin_c3_mini
board_build.flash_mode = dio
upload_speed = 460800
lib_deps = https://github.com/nRF24/RF24.git#v1.4.11
